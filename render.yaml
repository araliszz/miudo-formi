# PROVISIONA SERVIÇOS PAGOS. Confira o custo no Render antes de aplicar.
# Repositório: arquivos de formi na raiz (server.js, package.json, render.yaml).
services:
  - type: web
    name: miudo-formi
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run db:init && npm run production:check
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: formi-production
          property: connectionString
      - key: PGSSL
        value: render-internal
      - key: PG_POOL_MAX
        value: "5"
      - key: TRUST_PROXY
        value: "1"
      - key: OWNER_EMAIL
        sync: false
      - key: REGISTRATION_MODE
        value: public
      - key: COMPANY_CREATION_MODE
        value: public
      - key: MAIL_MODE
        value: smtp
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: formi-production
    databaseName: formi
    user: formi_app
    plan: 0.1c-256mb
    region: virginia
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
